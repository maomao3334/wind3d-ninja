[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind3d-ninja"
version = "1.0.0"
description = "WindNinja-based multi-source wind-field downscaling CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES/WindNinja-LICENSE.txt"]
authors = [{name = "wind3d-ninja contributors"}]
dependencies = [
  "click>=8.1",
  "netCDF4>=1.6",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pyproj>=3.5",
  "PyYAML>=6.0",
  "rasterio>=1.3",
  "xlrd>=2.0",
]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8.0"]

[project.scripts]
wind3d-ninja = "wind3d_ninja.cli.main:cli"
wind3d-ninja-ui = "wind3d_ninja.ui.app:main"

[project.urls]
Homepage = "https://github.com/maomao3334/wind3d-ninja"
Repository = "https://github.com/maomao3334/wind3d-ninja"
Issues = "https://github.com/maomao3334/wind3d-ninja/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
